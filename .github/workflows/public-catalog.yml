name: WarLike Records public catalog
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  public-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript module syntax
        run: node --check assets/records-data.js
      - name: Test public roster, releases and news
        run: node --test tests/catalog-public.test.mjs
